name: Build Catalyst

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'source.json'
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned Catalyst.ipa
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: catalyst-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: catalyst-${{ runner.os }}-

      - name: Version
        run: |
          BASE=$(grep -E '^MARKETING_VERSION' Build.xcconfig | awk -F'= ' '{print $2}' | tr -d ' ')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "MARKETING_VERSION=${BASE}-nightly.${{ github.run_number }}" >> $GITHUB_ENV
          fi
          echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build
        run: |
          set -o pipefail
          make build 2>&1 | xcbeautify --renderer github-actions
          make fakesign
          make ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Catalyst-${{ env.MARKETING_VERSION }}
          path: Catalyst.ipa
          retention-days: 90

      # Every push to main refreshes the public "nightly" prerelease that source.json points to.
      - name: Publish nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly
          git push -f origin nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly Catalyst.ipa --clobber
            gh release edit nightly --prerelease --title "Catalyst Nightly (${SHORT_COMMIT})"
          else
            gh release create nightly Catalyst.ipa --prerelease --title "Catalyst Nightly (${SHORT_COMMIT})" --notes "Automatic nightly build from main."
          fi

      - name: Update source.json
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/catalyst/update_source.py --ipa Catalyst.ipa --version "$MARKETING_VERSION" --build "${{ github.run_number }}" --commit "$SHORT_COMMIT"
          git config user.name "mirazbakis"
          git config user.email "307711826+mirazbakis@users.noreply.github.com"
          git add source.json
          git commit -m "source.json: nightly ${MARKETING_VERSION} [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" Catalyst.ipa --generate-notes --title "Catalyst ${GITHUB_REF_NAME}"
